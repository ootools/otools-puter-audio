<!doctype html>
<!--
    OTools 插件版入口（覆盖上游同名文件）。
    与上游的差别：
      1. 不再加载 https://js.puter.com/v2/ —— 这个插件不接 Puter，文件走 OTools
         宿主的本机磁盘（见 shell/overlay/src/storage/puter.js）。
      2. 主题默认 **dark**（上游是 'system'）。首帧前那段内联脚本照旧解析，
         只是兜底值从 'system' 换成 'dark'，免得先画一帧浅色再切暗。
      3. 去掉了 canonical / og: / twitter: 这些只在公网上有意义的标签，
         以及指向 audio-editor.app 的外链。
    语言由 shell/src/otools/boot.js 跟随宿主。
  -->
<html lang="en" data-theme-resolved="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      // 插件版：默认 dark（上游是 system）。
      try {
        var t = (JSON.parse(localStorage.getItem('audio-studio:prefs') || '{}').theme) || 'dark';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themeResolved = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" />
    <title>Audio Studio</title>
    <meta
      name="description"
      content="A waveform and multitrack audio editor. Record, edit, restore, mix and master audio, saved as ordinary files on this computer."
    />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Audio Studio" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <noscript>Audio Studio needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
